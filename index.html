<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dracula TV — Eliza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05060a;
    --scar: #7a1620;
    --ember: #c94430;
    --gold: #d9b877;
    --text: #e8e4dc;
    --muted: #9a9da8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ============ SPLASH ============ */
  #splash {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #1a0e08 0%, var(--void) 70%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4rem;
    transition: opacity 1.2s ease, visibility 1.2s ease;
    overflow: hidden;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #splash::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(217,184,119,0.5), transparent),
      radial-gradient(1px 1px at 70% 20%, rgba(217,184,119,0.35), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(217,184,119,0.4), transparent),
      radial-gradient(1px 1px at 85% 65%, rgba(217,184,119,0.3), transparent),
      radial-gradient(1px 1px at 55% 85%, rgba(217,184,119,0.45), transparent);
    animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-14px); }
  }

  .splash-title {
    position: relative; z-index: 1;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }

  .btn-enter {
    position: relative; z-index: 1;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 0.95rem 3rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s;
    animation: glow 2.4s ease-in-out infinite;
  }
  .btn-enter:hover { background: var(--gold); color: #000; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 8px rgba(217,184,119,0.15); }
    50% { box-shadow: 0 0 24px rgba(217,184,119,0.4); }
  }

  /* ============ SCENE (fond image + texte) ============ */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  #bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #bg-image.visible { opacity: 0.55; }

  #scene-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(5,6,10,0.35) 0%, rgba(5,6,10,0.85) 80%);
  }

  #dialogue-wrap {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  #dialogue {
    max-width: 680px;
    width: 100%;
    font-size: clamp(1rem, 3vw, 1.35rem);
    line-height: 1.9;
    font-weight: 300;
  }

  .line {
    margin-bottom: 0.5rem;
    opacity: 0;
  }
  .line.active { opacity: 1; }

  .line .speaker {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.15rem;
  }
  .line.presentateur .speaker { color: var(--scar); }
  .line.marvens .speaker { color: var(--gold); }

  /* le mot lui-même reste toujours visible en flux normal, */
  /* seule son opacité anime : ça évite tout problème d'espace/apostrophe */
  .word {
    opacity: 0;
    transform: translateY(4px);
    display: inline;
    transition: opacity 0.15s ease, transform 0.15s ease;
    white-space: pre-wrap;
  }
  .word.shown {
    opacity: 1;
    transform: translateY(0);
  }

  .cursor-blink {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--ember);
    vertical-align: middle;
    animation: blink 0.9s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ GLITCH / BUG EFFECT ============ */
  .glitching #scene {
    animation: glitchShake 0.12s infinite;
  }
  @keyframes glitchShake {
    0% { transform: translate(0,0); filter: none; }
    20% { transform: translate(-4px, 2px); filter: hue-rotate(15deg); }
    40% { transform: translate(3px, -2px) skewX(1deg); filter: hue-rotate(-15deg); }
    60% { transform: translate(-2px, 1px); filter: none; }
    80% { transform: translate(2px, -1px) skewX(-1deg); filter: hue-rotate(10deg); }
    100% { transform: translate(0,0); filter: none; }
  }

  .glitch-bars {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.04) 0px,
      transparent 2px,
      transparent 4px
    );
  }
  .glitching .glitch-bars {
    opacity: 1;
    animation: barsFlicker 0.15s infinite;
  }
  @keyframes barsFlicker {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.3; }
  }

  /* ============ BLACKOUT ============ */
  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 700;
    opacity: 0;
    pointer-events: none;
  }

  /* ============ CRACKED GLASS EFFECT ============ */
  #crack-overlay {
    position: fixed;
    inset: 0;
    z-index: 750;
    pointer-events: none;
    opacity: 0;
  }
  #crack-svg {
    width: 100%;
    height: 100%;
  }
  .crack-line {
    stroke: rgba(255,255,255,0.85);
    stroke-width: 1.4;
    fill: none;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
  }

  /* sound toggle */
  #sound-toggle {
    position: fixed;
    bottom: 1.4rem;
    right: 1.4rem;
    z-index: 800;
    background: rgba(13,15,22,0.85);
    border: 1px solid var(--muted);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #sound-toggle.visible { opacity: 1; }
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <p class="splash-title">Une histoire<br>pour toi</p>
  <button class="btn-enter" onclick="enterSite()">Commencer</button>
</div>

<!-- ============ SCENE ============ -->
<div id="scene">
  <img id="bg-image" src="https://files.catbox.moe/6lx4a3.jpg" alt="">
  <div id="scene-overlay"></div>
  <div id="dialogue-wrap">
    <div id="dialogue"></div>
  </div>
</div>

<div class="glitch-bars"></div>
<div id="blackout"></div>
<div id="crack-overlay">
  <svg id="crack-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"></svg>
</div>

<audio id="voice-audio" preload="auto">
  <source src="https://files.catbox.moe/x8qjhk.wav" type="audio/wav">
</audio>

<button id="sound-toggle" onclick="toggleAudio()">🔊 Son</button>

<script>
/* ================= SCRIPT DU DIALOGUE ================= */
/* Chaque ligne : { speaker, text, bugHere? } */
const script = [
  { speaker: "presentateur", text: "Bonsoir, bienvenue sur Dracula TV. Ce soir, édition spéciale." },
  { speaker: "presentateur", text: "On m'a dit qu'il y avait ici un grand amoureux. Marvens, c'est bien toi ?" },
  { speaker: "marvens", text: "Oui, oui, c'est moi." },
  { speaker: "presentateur", text: "Parfait, Roméo. J'ai quelques questions pour toi, ça ne te dérange pas ?" },
  { speaker: "presentateur", text: "Dis-moi... c'est qui, Eliza, pour toi ?" },
  { speaker: "marvens", text: "Eliza, c'est la personne qui a vraiment tout changé dans ma vie." },
  { speaker: "presentateur", text: "Pourquoi tu l'aimes ?" },
  { speaker: "marvens", text: "Parce qu'elle m'accepte tel que je suis, avec tous mes défauts, et elle reste quand même." },
  { speaker: "presentateur", text: "Qu'est-ce que tu préfères chez elle ?" },
  { speaker: "marvens", text: "Son sourire, sans hésiter. Il me fait craquer à chaque fois, même après tout ce temps." },
  { speaker: "presentateur", text: "Et son petit défaut que tu adores quand même ?" },
  { speaker: "marvens", text: "Ah, elle va me tuer si je dis ça... mais je l'aime même pour ses défauts." },
  { speaker: "presentateur", text: "Qu'est-ce qu'elle te fait ressentir que personne d'autre ne t'a jamais fait ressentir ?" },
  { speaker: "marvens", text: "Qu'avec elle, je n'ai pas besoin de jouer un rôle. Je peux juste être moi." },
  { speaker: "presentateur", text: "Si tu devais la décrire en un mot ?" },
  { speaker: "marvens", text: "Un seul mot ? C'est difficile... je dirais \"unique\". Il n'y a pas d'autre mot." },
  { speaker: "presentateur", text: "Dernière question, Roméo, et c'est la plus importante. Si Eliza regardait cet écran maintenant, tu lui dirais quoi ?" },
  { speaker: "marvens", text: "Je lui dirais...", bugHere: true },

  /* ---- CRASH ICI ---- */

  { speaker: "presentateur", text: "Bah alors ? Il y a deux minutes t'avais réponse à tout, et là plus rien ? Sérieux ?" },
  { speaker: "presentateur", text: "T'étais tellement sûr de toi pour parler de son sourire, de son parfum, de je-sais-plus-quoi... et là, silence radio ?" },
  { speaker: "presentateur", text: "Ok, je vois le tableau. Monsieur \"je suis un romantique\" a la langue qui fourche au moment crucial." },
  { speaker: "presentateur", text: "Bon, écoute Eliza, si tu regardes ça : ton homme est en panne de mots, alors on va lui laisser le temps de se rattraper à l'écrit. Courage à lui." },
  { speaker: "marvens", text: "Non, j'ai les mots. Je voulais juste que ce soit parfait pour elle, pas pour la caméra." },
  { speaker: "marvens", text: "Disons que... la suite parle d'elle-même." },
  { speaker: "marvens", text: "Eliza. Il y a des amours tranquilles, et il y a le genre d'amour qui te prend entier. Le mien pour toi, c'est le deuxième. Depuis que tu es là, je ne vois plus mon avenir sans toi dedans. Tu es devenue une partie de comment j'imagine ma vie, mes projets, mes années à venir. Il y a des jours où je pense à toi tellement fort que ça me déconcentre, où un simple souvenir de toi me fait sourire tout seul, comme un fou. Je ne suis pas parfait, et je ne te le montre pas toujours assez. Mais ce que je ressens pour toi n'a rien de calme. C'est intense, parfois trop pour les mots. Le genre de sentiment qui donne envie de construire quelque chose de grand, de vrai, de durable. Tu es mon avenir, Eliza. Pas une idée vague — un vrai choix, que je referai chaque jour. Je t'aime comme on aime rarement. Entièrement. Sans retenue." },
  { speaker: "presentateur", text: "Et voilà, c'est tout pour cette édition spéciale de Dracula TV." },
  { speaker: "presentateur", text: "Eliza, si tu es arrivée jusqu'ici... j'espère que ton Roméo a fait du bon travail." },
  { speaker: "presentateur", text: "Merci à tous d'avoir suivi cette déclaration. On se retrouve très vite, pour une prochaine histoire." },
  { speaker: "presentateur", text: "Sur ce... à la prochaine !" }
];

/* ================= TIMING GLOBAL ================= */
/* Audio total : 2min45s = 165000 ms.                                 */
/* On répartit ce temps sur l'ensemble des mots + pauses entre lignes, */
/* proportionnellement à la longueur de chaque ligne, pour rester     */
/* synchronisé avec la voix du début à la fin.                        */
const TOTAL_AUDIO_MS = 165000;
const PAUSE_COURTE = 700;   // pause entre deux lignes courtes
const PAUSE_LONGUE = 1600;  // pause après une ligne longue (>120 caractères)
const PAUSE_BUG = 500;      // pause avant le déclenchement du bug

// Compte le nombre total de mots + le total de pauses prévues,
// pour déduire une vitesse de frappe (ms/mot) qui tienne dans 165s.
function countWords(str) {
  return str.trim().split(/\s+/).filter(Boolean).length;
}

let totalWords = 0;
let totalPauseMs = 0;
script.forEach((l) => {
  totalWords += countWords(l.text);
  if (l.bugHere) {
    totalPauseMs += PAUSE_BUG;
  } else {
    totalPauseMs += l.text.length > 120 ? PAUSE_LONGUE : PAUSE_COURTE;
  }
});

// Temps restant pour l'affichage mot-par-mot, réparti sur tous les mots.
const remainingMs = Math.max(TOTAL_AUDIO_MS - totalPauseMs, totalWords * 60);
const MS_PER_WORD = remainingMs / totalWords; // vitesse calculée dynamiquement

const dialogueEl = document.getElementById('dialogue');
const audio = document.getElementById('voice-audio');
let lineIndex = 0;

/* Découpe le texte en "mots" en gardant les espaces attachés au mot   */
/* précédent, et en conservant la ponctuation/apostrophes intactes.   */
/* Ex: "Qu'est-ce que" -> ["Qu'est-ce", " que"]                        */
function splitIntoTokens(text) {
  const parts = text.split(' ');
  return parts.map((w, i) => (i === 0 ? w : ' ' + w));
}

function renderLine(lineData) {
  const lineEl = document.createElement('p');
  lineEl.className = 'line ' + lineData.speaker;

  const label = document.createElement('span');
  label.className = 'speaker';
  label.textContent = lineData.speaker === 'presentateur' ? 'Présentateur' : 'Marvens';
  lineEl.appendChild(label);

  const tokens = splitIntoTokens(lineData.text);
  const wordSpans = [];
  tokens.forEach((tok) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    lineEl.appendChild(span);
    wordSpans.push(span);
  });

  const cursor = document.createElement('span');
  cursor.className = 'cursor-blink';
  lineEl.appendChild(cursor);

  dialogueEl.appendChild(lineEl);
  requestAnimationFrame(() => lineEl.classList.add('active'));

  return { lineEl, wordSpans, cursor };
}

function typeLine(wordSpans, cursor, onDone) {
  let i = 0;
  function next() {
    if (i >= wordSpans.length) {
      cursor.remove();
      onDone();
      return;
    }
    wordSpans[i].classList.add('shown');
    i++;
    // légère variation autour de la vitesse calculée, pour un rendu naturel
    const jitter = MS_PER_WORD * 0.25;
    const delay = MS_PER_WORD + (Math.random() * jitter * 2 - jitter);
    setTimeout(next, Math.max(delay, 40));
  }
  next();
}

/* Garde seulement les 3 dernières lignes visibles pour ne pas surcharger l'écran */
function trimDialogue() {
  while (dialogueEl.children.length > 3) {
    dialogueEl.removeChild(dialogueEl.firstChild);
  }
}

function playNextLine() {
  if (lineIndex >= script.length) return;
  const lineData = script[lineIndex];
  const { wordSpans, cursor } = renderLine(lineData);
  trimDialogue();

  typeLine(wordSpans, cursor, () => {
    if (lineData.bugHere) {
      setTimeout(triggerBugSequence, PAUSE_BUG);
      return;
    }
    lineIndex++;
    const pause = lineData.text.length > 120 ? PAUSE_LONGUE : PAUSE_COURTE;
    setTimeout(playNextLine, pause);
  });
}

/* ================= SEQUENCE DE BUG / CRASH ================= */
function triggerBugSequence() {
  document.body.classList.add('glitching');

  setTimeout(() => {
    document.body.classList.remove('glitching');
    startBlackout();
  }, 1200);
}

function startBlackout() {
  const blackout = document.getElementById('blackout');
  blackout.style.transition = 'opacity 0.5s ease';
  blackout.style.opacity = '1';

  setTimeout(() => {
    triggerCrackEffect();
  }, 600);
}

function triggerCrackEffect() {
  const overlay = document.getElementById('crack-overlay');
  const svg = document.getElementById('crack-svg');
  svg.innerHTML = '';

  const cx = 500, cy = 500;
  const cracks = 14;
  for (let i = 0; i < cracks; i++) {
    const angle = (Math.PI * 2 * i) / cracks + (Math.random() * 0.3);
    const len = 250 + Math.random() * 350;
    const midX = cx + Math.cos(angle) * len * 0.5 + (Math.random() * 60 - 30);
    const midY = cy + Math.sin(angle) * len * 0.5 + (Math.random() * 60 - 30);
    const endX = cx + Math.cos(angle) * len;
    const endY = cy + Math.sin(angle) * len;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${cx},${cy} Q${midX},${midY} ${endX},${endY}`);
    path.setAttribute('class', 'crack-line');
    svg.appendChild(path);
  }

  overlay.style.transition = 'opacity 0.1s ease';
  overlay.style.opacity = '1';

  const paths = svg.querySelectorAll('.crack-line');
  paths.forEach((p, i) => {
    setTimeout(() => {
      p.style.transition = 'stroke-dashoffset 0.25s ease-out';
      p.style.strokeDashoffset = '0';
    }, i * 18);
  });

  setTimeout(() => {
    revealSecondImage();
  }, 900);
}

function revealSecondImage() {
  const bgImage = document.getElementById('bg-image');
  bgImage.src = 'https://files.catbox.moe/qribvt.jpg';

  const blackout = document.getElementById('blackout');
  const crackOverlay = document.getElementById('crack-overlay');

  bgImage.onload = () => {
    bgImage.classList.add('visible');
    setTimeout(() => {
      blackout.style.opacity = '0';
      crackOverlay.style.transition = 'opacity 0.8s ease';
      crackOverlay.style.opacity = '0';
    }, 200);

    setTimeout(() => {
      lineIndex++;
      playNextLine();
    }, 1000);
  };
  /* fallback si l'image ne se charge pas */
  bgImage.onerror = () => {
    bgImage.classList.add('visible');
    blackout.style.opacity = '0';
    crackOverlay.style.opacity = '0';
    setTimeout(() => {
      lineIndex++;
      playNextLine();
    }, 1000);
  };
}

/* ================= SPLASH / AUDIO ================= */
let audioOn = true;

function toggleAudio() {
  audioOn = !audioOn;
  const btn = document.getElementById('sound-toggle');
  if (audioOn) {
    audio.play().catch(() => {});
    btn.textContent = '🔊 Son';
  } else {
    audio.pause();
    btn.textContent = '🔇 Son';
  }
}

function enterSite() {
  document.getElementById('splash').classList.add('hide');
  document.getElementById('sound-toggle').classList.add('visible');

  const bgImage = document.getElementById('bg-image');
  bgImage.classList.add('visible');

  audio.play().catch(err => {
    console.warn('Lecture audio bloquée:', err);
  });

  setTimeout(() => {
    playNextLine();
  }, 500);
}
</script>
</body>
</html>
